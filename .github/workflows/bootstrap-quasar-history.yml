name: Bootstrap Quasar fork history

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-quasar-history.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-quasar-history
  cancel-in-progress: false

jobs:
  import-history:
    if: github.repository == 'lost-rob0t/auto-dig-quasar'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Import Quasar and Auto-Dig integration history
        env:
          SOURCE_REPOSITORY: https://github.com/lost-rob0t/quasar-ui.git
          SOURCE_REF: agent/auto-dig-quasar-fork
        run: |
          set -euo pipefail

          bootstrap_sha="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add quasar-upstream "$SOURCE_REPOSITORY"
          git fetch --no-tags quasar-upstream "$SOURCE_REF"
          git checkout -B import/quasar-auto-dig FETCH_HEAD
          git merge \
            --no-ff \
            --allow-unrelated-histories \
            "$bootstrap_sha" \
            -m "git: import Quasar history into Auto-Dig fork"

          chmod +x scripts/bootstrap-starintel
          if [[ -f scripts/update-quasar-upstream ]]; then
            chmod +x scripts/update-quasar-upstream
          fi
          git add scripts/bootstrap-starintel scripts/update-quasar-upstream 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "bootstrap: preserve executable workspace scripts"
          fi

      - name: Validate imported fork
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm test
          VITE_BASE_PATH=/quasar/app/ npm run build
          test -f dist/index.html

      - name: Publish fork main without rewriting history
        run: |
          set -euo pipefail
          git push origin HEAD:main
          tag="auto-dig-bootstrap-$(date -u +%Y-%m-%d)"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git tag -a "$tag" -m "First verified Auto-Dig Quasar fork import"
            git push origin "refs/tags/$tag"
          fi

      - name: Report exact commits
        run: |
          printf 'fork_commit=%s\n' "$(git rev-parse HEAD)"
          printf 'integration_parent=%s\n' "$(git rev-parse HEAD^1)"
          printf 'bootstrap_parent=%s\n' "$(git rev-parse HEAD^2 2>/dev/null || true)"
