name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-lock:
    if: github.ref == 'refs/heads/agent/research-nodes-browser-actors' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/research-nodes-browser-actors
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --package-lock-only
      - name: Commit dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update tested research-node runtime lock"
          git push origin HEAD:agent/research-nodes-browser-actors

  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:boundaries
      - run: npm run check:static
      - run: npm test
      - run: npm run build
      - name: Validate application artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/404.html
          test -s dist/sw.js
          test -s dist/manifest.webmanifest
          grep -q "Quasar" dist/index.html
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: baseline-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
